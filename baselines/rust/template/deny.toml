# cargo-deny: licences, advisories, duplicate and wildcard dependencies,
# registries. `just deny` runs everything; CI runs advisories on main and on
# a schedule only, so a new advisory never fails an unrelated PR.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Only crates we depend on directly fail for being unmaintained.
unmaintained = "workspace"
# { id = "RUSTSEC-…", reason = "why it does not apply" }
ignore = []

[licenses]
confidence-threshold = 0.93
# The list is policy (what we accept), not an inventory of what is in use.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Every dependency is declared once in [workspace.dependencies].
[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

# Build scripts and proc-macros run on every build, including the clippy run
# in the Stop hook. Refuse crates that ship executables or scripts to run.
[bans.build]
executables = "deny"
interpreted = "deny"
enable-builtin-globs = true
include-dependencies = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
