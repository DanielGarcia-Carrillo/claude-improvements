# cargo-deny: licenses, advisories, duplicate and wildcard dependencies,
# registries. `just deny` (part of `just verify`) and PR CI check all but
# advisories; CI checks those on main and weekly, so a new advisory never
# fails an unrelated PR. `just deny-all` checks everything now.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Only crates we depend on directly fail for being unmaintained.
unmaintained = "workspace"
# { id = "RUSTSEC-…", reason = "why it does not apply" }
ignore = []

[licenses]
confidence-threshold = 0.93
# The list is policy (what we accept), not an inventory of what is in use.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# A crate two members use is declared once, in [workspace.dependencies].
# `just deps-inherited` holds every member to that, one at a time.
[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

# Crates may have build scripts and proc-macros, and many need them. This
# refuses crates that ship prebuilt executables or interpreted scripts for a
# build script or proc-macro to run. It audits the lock file; it is not a
# sandbox: rust-analyzer and `cargo build` run a new dependency's build script
# before any check does.
[bans.build]
executables = "deny"
interpreted = "deny"
enable-builtin-globs = true
include-dependencies = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
