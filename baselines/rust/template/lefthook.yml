# Lefthook hides unstaged edits in partially staged files while these jobs run.
# Fixers re-stage their changes. Keep whole-project checks in verify and CI.
# Spelling follows writes to the same files; other files can be checked in parallel.
pre-commit:
  parallel: true
  jobs:
    - name: rust
      glob: "*.rs"
      group:
        piped: true
        jobs:
          - name: format
            # Do not follow mod declarations into files outside the staged set.
            run: mise exec -- rustfmt --config skip_children=true {staged_files}
            stage_fixed: true
          - name: spelling
            run: mise exec -- typos --force-exclude {staged_files}
    - name: shell
      glob: '*.{sh,bash,ksh,bats}'
      group:
        piped: true
        jobs:
          - name: format-and-lint
            run: mise exec -- bash scripts/check-shell.sh --fix {staged_files}
            stage_fixed: true
          - name: spelling
            run: mise exec -- typos --force-exclude {staged_files}
    - name: spelling-other
      exclude: "*.{rs,sh,bash,ksh,bats}"
      run: mise exec -- typos --force-exclude {staged_files}
