# Python comes from .python-version through uv, and every checker (ruff, ty,
# pytest, deptry) from uv.lock. mise pins the two tools outside the project,
# each a prebuilt binary, so every checkout and CI agree.
[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
typos = "1.51.1"

lefthook = "2.2.2"
uv = "0.13.6"
just = "1.59.0"
