# Lefthook hides unstaged edits in partially staged files while these jobs run.
# Fixers re-stage their changes. Keep whole-project checks in verify and CI.
pre-commit:
  parallel: true
  jobs:
    - name: python
      glob: "*.{py,pyi}"
      run: mise exec -- uv run --locked ruff check --fix {staged_files} && mise exec -- uv run --locked ruff format {staged_files}
      stage_fixed: true
    - name: spelling
      run: mise exec -- typos --force-exclude {staged_files}
