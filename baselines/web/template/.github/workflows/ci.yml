name: ci

on:
  push:
    branches: [main]
  # ready_for_review starts the first real run of a PR opened as a draft;
  # converted_to_draft starts a run that skips the work and so cancels any
  # run still in progress.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a branch run; a run on main always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs on GitHub-hosted Ubuntu unless the CI_RUNNER repository
# variable names another runner label (e.g. blacksmith-2vcpu-ubuntu-2404 on a
# private repo). Deleting the variable moves CI back, with no commit.
jobs:
  verify:
    # Drafts skip verify: agents push many of them, and a draft can't merge.
    # Only the short `ci` job runs and reports; marking the PR ready runs verify.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Template placeholders all spell "replace me"; fail until they're filled.
      - name: No template placeholders left
        run: if git grep -niE 'replace[-_ ]?me([^a-z]|$)' -- ':!.github/workflows/ci.yml'; then echo '::error::Replace the template placeholders listed above.'; exit 1; fi

      # Node from mise.toml, so CI and every checkout run the same one.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      # pnpm from package.json's packageManager; no version here on purpose.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Browsers are cached per Playwright version; the system libraries
      # they need aren't, so a cache hit still installs those.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium webkit
      - if: ${{ steps.browsers.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium webkit

      # The same gate as local: typecheck, lint, format, unit, browser and
      # story tests, build, end-to-end.
      - run: pnpm verify

      # Only on failure, and briefly: traces record request headers and bodies.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      # The dist/ that just passed, handed to the deploy job below.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Production ships from main only. The token is a secret of the `production`
  # environment, limited to the main branch, so no other branch's workflow can
  # read it, and it never shares a machine with the test run's dependencies.
  # Sessions never deploy (.claude/hooks/guard-deploy.ts).
  deploy:
    needs: [verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Always GitHub-hosted: the token never goes to a third-party runner.
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Only wrangler is needed, and no install script runs next to the token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # The one required status check. Jobs above can be renamed or split without
  # touching branch protection.
  ci:
    if: ${{ always() }}
    needs: [verify]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    # Read-only access to this run's own job and step timings.
    permissions:
      actions: read
    steps:
      # The ten slowest steps of the run, in the run's summary page. It never
      # fails the required check, even if the API call does.
      - name: Slowest steps
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Slowest steps'
            echo
            echo '| Seconds | Job | Step |'
            echo '|---:|---|---|'
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | .name as $j | .steps[]? | select(.started_at and .completed_at)
                    | [((.completed_at | fromdate) - (.started_at | fromdate)), $j, .name] | @tsv' \
              | sort -rn | head -10 | awk -F'\t' '{printf "| %d | %s | %s |\n", $1, $2, $3}'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
