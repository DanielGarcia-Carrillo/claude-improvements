name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a branch run; a run on main always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs on GitHub-hosted Ubuntu unless the CI_RUNNER repository
# variable names another runner label (e.g. blacksmith-2vcpu-ubuntu-2404 on a
# private repo). Deleting the variable moves CI back, with no commit.
jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Template placeholders all spell "replace me"; fail until they're filled.
      - name: No template placeholders left
        run: if git grep -niE 'replace[-_ ]?me([^a-z]|$)' -- ':!.github/workflows/ci.yml'; then echo '::error::Replace the template placeholders listed above.'; exit 1; fi

      # Node from mise.toml, so CI and every checkout run the same one.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      # pnpm from package.json's packageManager; no version here on purpose.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit

      # The same gate as local: typecheck, lint, format, unit, browser and
      # story tests, build, end-to-end. SCREENSHOT_DIR makes the story and
      # screen tests save PNGs too, for the screenshots job.
      - run: pnpm verify
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

      # Only on failure, and briefly: traces record request headers and bodies.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      # The dist/ that just passed, handed to the deploy job below.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Production ships from main only. The token is a secret of the `production`
  # environment, limited to the main branch, so no other branch's workflow can
  # read it, and it never shares a machine with the test run's dependencies.
  # Sessions never deploy (.claude/hooks/guard-deploy.ts).
  deploy:
    needs: [verify]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Always GitHub-hosted: the token never goes to a third-party runner.
    runs-on: ubuntu-26.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Only wrangler is needed, and no install script runs next to the token.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Shows the captures a PR changes in its description, before and after
  # (scripts/pr-screenshots.ts), and keeps main's captures current. Images go
  # to the orphan `screenshots` branch, so they keep the repo's access rules.
  # Skipped for forks and Dependabot, whose tokens can't write. Nothing from
  # npm runs with this job's write token: only git, gh and that one script.
  screenshots:
    needs: [verify]
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/pr-screenshots.ts
            mise.toml
          sparse-checkout-cone-mode: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: screenshots/
      - run: node scripts/pr-screenshots.ts --captures screenshots --sha "$HEAD_SHA" ${PR:+--pr "$PR"}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # The one required status check. Jobs above can be renamed or split without
  # touching branch protection.
  ci:
    if: ${{ always() }}
    needs: [verify]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    # Read-only access to this run's own job and step timings.
    permissions:
      actions: read
    steps:
      # The ten slowest steps of the run, in the run's summary page. It never
      # fails the required check, even if the API call does.
      - name: Slowest steps
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Slowest steps'
            echo
            echo '| Seconds | Job | Step |'
            echo '|---:|---|---|'
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | .name as $j | .steps[]? | select(.started_at and .completed_at)
                    | [((.completed_at | fromdate) - (.started_at | fromdate)), $j, .name] | @tsv' \
              | sort -rn | head -10 | awk -F'\t' '{printf "| %d | %s | %s |\n", $1, $2, $3}'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
