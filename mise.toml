[tools]
typos = "1.51.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
yq = "4.54.3"
lefthook = "2.2.2"
node = "26"

[tasks.verify]
description = "Run the repository quality checks"
run = ["typos", "bash baselines/general/files/scripts/check-shell.sh", "node --test mods/new-project/tests/baselines.node.mts"]

# Scaffold each template through mods/new-project with its pinned lockfile
# from baselines/scaffold-check/ and run the project's own verify. Name
# stacks to run only those: `mise run scaffold:verify python`.
[tasks."scaffold:verify"]
description = "Check that each template scaffolds into a project that passes its own verify"
run = "node mods/new-project/tests/scaffold-verify.ts"

[tasks."shell:check"]
run = "bash baselines/general/files/scripts/check-shell.sh"

[tasks."shell:fix"]
run = "bash baselines/general/files/scripts/check-shell.sh --fix"

[tasks.bootstrap]
description = "Install this checkout's Git hooks"
run = "lefthook install"
